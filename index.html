
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>𝐒𝐀™ ➤𝐓𝐫𝐚𝐝𝐞𝐫 𝐕𝐈𝐏</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #020205; font-family: 'Segoe UI', sans-serif; }
      
      /* ব্যাকগ্রাউন্ড গ্রিড অ্যানিমেশন */
      .bg-animation { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(transparent 95%, rgba(0, 255, 255, 0.03) 50%), linear-gradient(90deg, transparent 95%, rgba(0, 255, 255, 0.03) 50%); background-size: 30px 30px; z-index: 0; }
      
      .iframe-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; justify-content: center; }
      iframe { width: 100%; max-width: 450px; height: 100%; border: none; background: #000; }
      
      /* বক্সের বাইরের গ্লোয়িং এবং মুভিং বর্ডার */
      .box-container { position: fixed; top: 120px; left: 20px; width: 175px; z-index: 9999; touch-action: none; }
      
      .box-container::before {
        content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
        background: linear-gradient(90deg, #00ffff, #ff0000, #00ffff, #ff0000);
        background-size: 400%; border-radius: 16px; z-index: -1;
        animation: cyber-border 5s linear infinite; filter: blur(12px);
      }

      @keyframes cyber-border {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .box { background: rgba(5, 5, 12, 0.98); border-radius: 14px; color: #fff; padding: 15px 10px; text-align: center; border: 1.5px solid rgba(0, 255, 255, 0.4); box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.1); }
      
      .box-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 1.5px solid rgba(0, 255, 255, 0.5); padding-bottom: 8px; }
      .title { font-size: 11px; font-weight: 900; color: #00ffff; text-shadow: 0 0 12px #00ffff; line-height: 1.2; text-align: left; }
      
      .tg-btn { width: 22px; height: 22px; background: #0088cc; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px #0088cc; }
      .tg-btn img { width: 13px; height: 13px; }

      /* ইনপুট বক্স অ্যানিমেশন */
      input { 
        width: 88%; padding: 9px; background: #000; border: 1px solid #00ffff; border-radius: 6px; 
        color: #fff; margin-bottom: 12px; font-size: 11px; text-align: center; outline: none;
        box-shadow: 0 0 5px rgba(0, 255, 255, 0.2);
        animation: input-pulse 2s infinite ease-in-out;
      }

      @keyframes input-pulse {
        0%, 100% { border-color: #00ffff; box-shadow: 0 0 5px rgba(0, 255, 255, 0.3); }
        50% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
      }

      .btn-login { 
        width: 95%; padding: 11px 0; border-radius: 8px; border: none; font-size: 11px; 
        font-weight: bold; cursor: pointer; background: linear-gradient(45deg, #00ffff, #0088cc); 
        color: #000; text-transform: uppercase; letter-spacing: 1px;
      }
      
      /* প্রেডিকশন এরিয়া অ্যানিমেশন */
      .signal-area { 
        background: rgba(0, 255, 255, 0.04); border-radius: 10px; padding: 20px 5px; 
        border: 1px solid rgba(0, 255, 255, 0.2); margin: 5px 0;
        position: relative; overflow: hidden;
      }

      /* স্ক্যানিং ইফেক্ট */
      .signal-area::after {
        content: ''; position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
        background: linear-gradient(transparent, rgba(0, 255, 255, 0.2), transparent);
        animation: scan 3s infinite linear;
      }

      @keyframes scan {
        0% { top: -100%; }
        100% { top: 100%; }
      }

      .signal-text { font-size: 68px; font-weight: 900; line-height: 1; text-shadow: 0 0 35px currentColor; margin: 5px 0; }
      .signal-type { font-size: 26px; font-weight: 900; letter-spacing: 6px; margin-top: 5px; }
      .timer { font-size: 15px; color: #ffff00; font-weight: bold; margin-top: 12px; }
      
      .action-row { display: flex; gap: 8px; margin-top: 15px; }
      .btn-small { flex: 1; padding: 9px; font-size: 10px; border-radius: 6px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
      .btn-hide { background: #1a1a1a; border: 1px solid #333; }
      .btn-exit { background: #660000; border: 1px solid #ff0000; }
      
      #floatingLogo { 
        position: fixed; top: 45%; left: 10px; width: 50px; height: 50px; z-index: 10000; 
        display: none; touch-action: none; background: #00ffff; border-radius: 50%; 
        box-shadow: 0 0 25px #00ffff; align-items: center; justify-content: center; 
        font-weight: 900; color: #000; font-size: 11px; border: 2px solid #fff;
      }
    </style>
  </head>
  <body>
    <div class="bg-animation"></div>
    <div class="iframe-container">
      <iframe src="https://bdwin24.net/register?inviteCode=WA6AUSN&from=web"></iframe>
    </div>
    
    <div class="box-container" id="mainContainer">
      <div class="box">
        <div class="box-header">
          <div class="title">❮ᎡᎪ™ 𝗧𝗿𝗮𝗱𝗲𝗿❯<br />𝗣𝗥𝗘𝗠𝗜𝗨𝗠 𝗛𝗔𝗖𝗞</div>
          <a href="https://t.me/tigertraderking" target="_blank" class="tg-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" />
          </a>
        </div>
        
        <div id="loginSection">
          <input type="text" id="passInput" placeholder="PASSWORD HERE" />
          <button class="btn-login" id="loginBtn">INITIALIZE HACK</button>
        </div>

        <div id="signalSection" style="display:none;">
          <div class="signal-area">
            <div id="signalResult" class="signal-text" style="color:#00ff00;">--</div>
            <div id="signalType" class="signal-type" style="color:#00ffff;">WAIT</div>
            <div class="timer">NEXT: <span id="timerCount">30</span>s</div>
          </div>
        </div>

        <div class="action-row">
          <button class="btn-small btn-hide" id="hideBtn">HIDE</button>
          <button class="btn-small btn-exit" id="exitBtn">EXIT</button>
        </div>
      </div>
    </div>

    <div id="floatingLogo">OPEN</div>

    <script>
      // লগইন চেক (পাসওয়ার্ড: RA-TRADER90)
      document.getElementById("loginBtn").onclick = function() {
        if (document.getElementById("passInput").value === "RA-TRADER90") {
          document.getElementById("loginSection").style.display = "none";
          document.getElementById("signalSection").style.display = "block";
          start30sHacking();
        } else { alert("ACCESS DENIED: WRONG PASSWORD"); }
      };

      let lastTag = "";

      function start30sHacking() {
        setInterval(() => {
          let now = new Date();
          let utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          let bdTime = new Date(utc + (3600000 * 6));
          
          let hr = bdTime.getHours();
          let min = bdTime.getMinutes();
          let sec = bdTime.getSeconds();

          let isSecondHalf = sec >= 30;
          let currentTag = hr + ":" + min + ":" + (isSecondHalf ? "30" : "00");
          let remaining = isSecondHalf ? 60 - sec : 30 - sec;

          if (currentTag !== lastTag) {
            lastTag = currentTag;

            let seed = (hr * 120) + (min * 2) + (isSecondHalf ? 1 : 0);
            let resultNum = (seed * 37 + 17) % 10; 
            
            let isBig = resultNum >= 5;
            let typeText = isBig ? "BIG" : "SMALL";
            let color = isBig ? "#00ff00" : "#ff3333";

            document.getElementById("signalResult").innerText = resultNum;
            document.getElementById("signalResult").style.color = color;
            document.getElementById("signalType").innerText = typeText;
            document.getElementById("signalType").style.color = color;
          }

          document.getElementById("timerCount").innerText = remaining;
        }, 1000);
      }

      // ড্র্যাগিং ফাংশন
      function drag(el, isLogo = false) {
        let p1=0, p2=0, p3=0, p4=0, moved=false;
        el.ontouchstart = (e) => {
          if(e.target.tagName==='INPUT' || e.target.tagName==='BUTTON') return;
          moved=false; let ev = e.touches[0]; p3=ev.clientX; p4=ev.clientY;
          document.ontouchmove = (e) => {
            moved=true; let ev = e.touches[0];
            p1=p3-ev.clientX; p2=p4-ev.clientY; p3=ev.clientX; p4=ev.clientY;
            el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
          };
          document.ontouchend = () => {
            document.ontouchmove = null;
            if(isLogo && !moved) { 
              document.getElementById("mainContainer").style.display="block"; 
              document.getElementById("floatingLogo").style.display="none"; 
            }
          };
        };
      }
      drag(document.getElementById("mainContainer"));
      drag(document.getElementById("floatingLogo"), true);

      document.getElementById("hideBtn").onclick = () => {
        document.getElementById("mainContainer").style.display="none";
        document.getElementById("floatingLogo").style.display="flex";
      };
      document.getElementById("exitBtn").onclick = () => location.reload();
    </script>
  </body>
</html>
